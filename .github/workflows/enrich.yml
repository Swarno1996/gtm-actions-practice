# Runs scripts/enrich_leads.py on a schedule and commits the updated log.
# Cron times are UTC. GitHub only runs schedules from the default branch (main).

name: Enrich leads

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes. Private repo? use "0 */2 * * *" after practice
  workflow_dispatch:            # adds the "Run workflow" button in the Actions tab
    inputs:
      dry_run:
        description: "Score leads but write nothing and send no alerts"
        type: boolean
        default: false

permissions:
  contents: write               # the job commits data/ back to the repo
  issues: write                 # tier A alerts are GitHub issues

concurrency:
  group: enrich                 # never let two runs write the log at the same time
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest      # a fresh Linux machine, deleted after the job

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the commit step can rebase safely

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the script
        env:
          GITHUB_TOKEN: ${{ github.token }}                    # built in, needed by notify()
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # empty until you add the secret
          DRY_RUN: ${{ inputs.dry_run }}                       # empty on scheduled runs = false
        run: python scripts/enrich_leads.py

      - name: Commit the updated log
        if: ${{ !cancelled() && inputs.dry_run != true }}     # also runs after an intake error
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update lead log [skip ci]"
            git pull --rebase origin main
            git push
          fi
