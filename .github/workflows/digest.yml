# Runs scripts/daily_digest.py once a day and commits the report.
# "0 7 * * *" is 07:00 UTC = 09:00 Berlin in summer (CEST). Use "0 8 * * *" in winter (CET).

name: Daily digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/daily_digest.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily digest [skip ci]"
            git pull --rebase origin main
            git push
          fi
